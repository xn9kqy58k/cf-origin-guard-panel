# Example cf-origin-guard configuration.
# Copy to /etc/cf-origin-guard/cf-origin-guard.conf and adjust if needed.

ENABLE_GUARD="0"
ENABLE_AUTO_SYNC="1"
WEB_PORTS="80,443"
ENABLE_IPV6="auto"
DROP_ACTION="DROP"
ALLOW_LOOPBACK="1"

# Default off. Enable from `cf` panel after confirming existing Nginx behavior.
MANAGE_NGINX_REALIP="0"
NGINX_REALIP_CONF="auto"
NGINX_REALIP_STRICT="0"

CF_IPV4_URL="https://www.cloudflare.com/ips-v4"
CF_IPV6_URL="https://www.cloudflare.com/ips-v6"
CURL_CONNECT_TIMEOUT="10"
CURL_MAX_TIME="45"
CURL_RETRIES="3"

# Optional direct-origin allowlist. Use only when a trusted system must bypass Cloudflare.
EXTRA_ALLOWLIST_IPV4=""
EXTRA_ALLOWLIST_IPV6=""

MENU_DEFAULT_DOMAIN=""
MENU_DEFAULT_ORIGIN_IP=""
LOG_FILE="/var/log/cf-origin-guard.log"
